<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>คำถามสำคัญ 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF8F3;
    --blush:#FFE3EC;
    --rose:#E8547C;
    --rose-deep:#C43A5E;
    --plum:#4A2C3D;
    --gold:#E8B84B;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background: radial-gradient(circle at 20% 20%, var(--blush), var(--cream) 60%);
    font-family:'Sarabun', sans-serif;
    color:var(--plum);
    overflow:hidden;
  }
  .stage{
    position:relative;
    width:100%; height:100vh;
    display:flex; align-items:center; justify-content:center;
  }

  /* ambient floating hearts */
  .heart{
    position:fixed;
    bottom:-10vh;
    font-size:1.4rem;
    opacity:0.35;
    animation: float linear infinite;
    pointer-events:none;
    color:var(--rose);
    user-select:none;
  }
  @keyframes float{
    0%{ transform:translateY(0) rotate(0deg); opacity:0; }
    10%{ opacity:0.45; }
    90%{ opacity:0.35; }
    100%{ transform:translateY(-110vh) rotate(25deg); opacity:0; }
  }

  .card{
    position:relative;
    z-index:2;
    width:min(420px, 88vw);
    background:rgba(255,255,255,0.72);
    backdrop-filter: blur(6px);
    border:1px solid rgba(232,84,124,0.18);
    border-radius:28px;
    padding:2.6rem 1.9rem 2.2rem;
    text-align:center;
    box-shadow: 0 20px 50px -20px rgba(196,58,94,0.35);
    transition: transform 0.4s ease;
  }

  .eyebrow{
    font-size:0.78rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--rose-deep);
    font-weight:600;
    margin-bottom:0.6rem;
    opacity:0.8;
  }

  h1{
    font-family:'Mali', sans-serif;
    font-weight:700;
    font-size:clamp(1.7rem, 6vw, 2.3rem);
    line-height:1.35;
    margin:0 0 0.6rem;
    color:var(--rose-deep);
  }

  .sub{
    font-size:0.98rem;
    line-height:1.6;
    color:var(--plum);
    opacity:0.85;
    margin:0 0 2rem;
  }

  .btn-row{
    position:relative;
    display:flex;
    gap:1rem;
    justify-content:center;
    align-items:center;
    min-height:64px;
  }

  button{
    font-family:'Sarabun', sans-serif;
    font-weight:600;
    border:none;
    border-radius:999px;
    cursor:pointer;
    transition: all 0.18s ease;
  }

  #yesBtn{
    background: linear-gradient(135deg, var(--rose), var(--rose-deep));
    color:#fff;
    padding:0.85rem 1.8rem;
    font-size:1rem;
    box-shadow:0 10px 24px -8px rgba(196,58,94,0.55);
  }
  #yesBtn:hover{ transform:translateY(-2px) scale(1.03); }
  #yesBtn:active{ transform:scale(0.97); }

  #noBtn{
    background:#fff;
    color:var(--rose-deep);
    padding:0.85rem 1.6rem;
    font-size:1rem;
    border:1.5px solid rgba(232,84,124,0.4);
    position:relative;
  }

  .dodge-note{
    font-size:0.8rem;
    color:var(--rose-deep);
    opacity:0.75;
    margin-top:1.1rem;
    min-height:1.2em;
    font-style:italic;
  }

  /* ---- Result screen ---- */
  .result{
    display:none;
    z-index:3;
  }
  .result.show{ display:block; }
  .card.hidden{ display:none; }

  .result h1{ font-size:clamp(1.9rem, 7vw, 2.6rem); }
  .stats{
    margin-top:1.4rem;
    padding-top:1.2rem;
    border-top:1px dashed rgba(232,84,124,0.3);
    font-size:0.88rem;
    color:var(--plum);
    opacity:0.8;
    text-align:left;
    line-height:1.9;
  }
  .stats b{ color:var(--rose-deep); }

  .burst{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:1;
  }
  .confetti{
    position:absolute;
    top:-5vh;
    font-size:1.3rem;
    animation: fall 2.6s ease-in forwards;
  }
  @keyframes fall{
    to{ transform: translateY(105vh) rotate(360deg); opacity:0.2; }
  }

  footer{
    position:fixed;
    bottom:14px;
    left:0; right:0;
    text-align:center;
    font-size:0.72rem;
    color:var(--rose-deep);
    opacity:0.45;
    z-index:2;
  }
</style>
</head>
<body>

<div class="stage">

  <!-- Question card -->
  <div class="card" id="questionCard">
    <div class="eyebrow">คำถามสำคัญ</div>
    <h1>ที่รัก... เธอจะเป็นแฟนของฉันไหม? 💕</h1>
    <p class="sub">คิดมานานแล้ว กล้าๆ หน่อยก็แล้วกันนะ 😳<br>ตอบตรงนี้เลยได้เลย</p>

    <div class="btn-row">
      <button id="yesBtn" onclick="sayYes()">ตกลงค่ะ 💗</button>
      <button id="noBtn" onmouseover="dodge()" ontouchstart="dodge(event)" onclick="dodge()">ไม่ค่ะ</button>
    </div>
    <div class="dodge-note" id="dodgeNote"></div>
  </div>

  <!-- Result card -->
  <div class="card result" id="resultCard">
    <div class="eyebrow">ผลลัพธ์</div>
    <h1 id="resultTitle">ยินดีด้วย! 🎉</h1>
    <p class="sub" id="resultSub">เธอตอบว่า “ตกลงค่ะ” อย่างเป็นทางการแล้ว 💕<br>วันนี้เป็นวันที่ดีที่สุดวันหนึ่งเลย</p>
    <div class="stats">
      เวลาที่กดตอบ: <b id="resultTime">-</b><br>
      จำนวนครั้งที่ปุ่ม "ไม่ค่ะ" หนี: <b id="dodgeCount">0</b> ครั้ง<br>
      คำตอบสุดท้าย: <b id="resultAnswer">ตกลงค่ะ</b>
    </div>
  </div>

</div>

<div class="burst" id="burst"></div>
<footer>made with 💕</footer>

<script>
let dodgeCount = 0;
const notes = [
  "เอ๊ะ ทำไมหนีล่ะ 🥺",
  "ลองอีกทีนะ...",
  "จะไปไหนน่ะ 😳",
  "กดปุ่มสีชมพูดีกว่านะ 💗",
  "ยอมแพ้แล้วใช่ไหม 😆",
  "งั้นตอบตกลงเลยละกัน 👉"
];

function dodge(e){
  if(e) e.preventDefault();
  const noBtn = document.getElementById('noBtn');
  const row = document.querySelector('.btn-row');
  const rowRect = row.getBoundingClientRect();
  const btnRect = noBtn.getBoundingClientRect();

  dodgeCount++;

  // move the "no" button to a random spot within the row bounds
  const maxX = rowRect.width - btnRect.width - 8;
  const maxY = 0;
  const randX = Math.random() * maxX;
  noBtn.style.position = 'absolute';
  noBtn.style.left = randX + 'px';
  noBtn.style.top = (Math.random() * 10 - 5) + 'px';

  // shrink "no", grow "yes" slightly each time, cap it
  const yesBtn = document.getElementById('yesBtn');
  const scale = Math.min(1 + dodgeCount * 0.06, 1.6);
  yesBtn.style.transform = `scale(${scale})`;
  noBtn.style.opacity = Math.max(1 - dodgeCount * 0.08, 0.35);

  const note = document.getElementById('dodgeNote');
  note.textContent = notes[Math.min(dodgeCount - 1, notes.length - 1)];
}

function sayYes(){
  const now = new Date();
  const timeStr = now.toLocaleString('th-TH', { dateStyle:'medium', timeStyle:'short' });

  document.getElementById('questionCard').classList.add('hidden');
  document.getElementById('resultCard').classList.add('show');
  document.getElementById('resultTime').textContent = timeStr;
  document.getElementById('dodgeCount').textContent = dodgeCount;

  launchConfetti();
}

function launchConfetti(){
  const burst = document.getElementById('burst');
  const emojis = ['💕','💗','🎉','✨','💖','🌸'];
  for(let i=0; i<40; i++){
    const el = document.createElement('div');
    el.className = 'confetti';
    el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    el.style.left = Math.random()*100 + 'vw';
    el.style.animationDelay = (Math.random()*0.8) + 's';
    el.style.fontSize = (1 + Math.random()*1.2) + 'rem';
    burst.appendChild(el);
    setTimeout(() => el.remove(), 3600);
  }
}

// ambient floating hearts in the background
function spawnHeart(){
  const h = document.createElement('div');
  h.className = 'heart';
  h.textContent = ['💗','💕','♡','💖'][Math.floor(Math.random()*4)];
  h.style.left = Math.random()*100 + 'vw';
  h.style.animationDuration = (7 + Math.random()*6) + 's';
  h.style.fontSize = (1 + Math.random()*1.4) + 'rem';
  document.body.appendChild(h);
  setTimeout(() => h.remove(), 14000);
}
setInterval(spawnHeart, 900);
for(let i=0;i<6;i++) setTimeout(spawnHeart, i*300);
</script>

</body>
</html>
